name: Release Unifra Plugins

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io/unifralabs/apisix

jobs:
  release-plugins:
    name: Release Plugin Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create plugin package
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          PACKAGE_NAME="unifra-apisix-plugins-${VERSION}"

          mkdir -p "${PACKAGE_NAME}/apisix/plugins"

          cp -r unifra "${PACKAGE_NAME}/"
          cp -r apisix/plugins/* "${PACKAGE_NAME}/apisix/plugins/"
          cp -r conf "${PACKAGE_NAME}/" 2>/dev/null || true

          echo '#!/bin/bash' > "${PACKAGE_NAME}/install.sh"
          echo 'set -e' >> "${PACKAGE_NAME}/install.sh"
          echo 'INSTALL_DIR="${1:-/opt/unifra-apisix}"' >> "${PACKAGE_NAME}/install.sh"
          echo 'mkdir -p "${INSTALL_DIR}/apisix/plugins"' >> "${PACKAGE_NAME}/install.sh"
          echo 'cp -r unifra "${INSTALL_DIR}/"' >> "${PACKAGE_NAME}/install.sh"
          echo 'cp -r apisix/plugins/* "${INSTALL_DIR}/apisix/plugins/"' >> "${PACKAGE_NAME}/install.sh"
          echo 'cp -r conf "${INSTALL_DIR}/" 2>/dev/null || true' >> "${PACKAGE_NAME}/install.sh"
          echo 'echo "Installed to ${INSTALL_DIR}. Set extra_lua_path in config.yaml."' >> "${PACKAGE_NAME}/install.sh"
          chmod +x "${PACKAGE_NAME}/install.sh"

          echo '# Unifra APISIX Plugins' > "${PACKAGE_NAME}/README.md"
          echo '' >> "${PACKAGE_NAME}/README.md"
          echo 'Install: `./install.sh /opt/unifra-apisix`' >> "${PACKAGE_NAME}/README.md"
          echo '' >> "${PACKAGE_NAME}/README.md"
          echo 'Config: `extra_lua_path: "/opt/unifra-apisix/?.lua"`' >> "${PACKAGE_NAME}/README.md"

          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: unifra-apisix-plugins-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: release-plugins
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}:${{ needs.release-plugins.outputs.version }}
            ${{ env.REGISTRY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
