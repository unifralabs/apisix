name: Test Suite

on:
  push:
    branches: [master, main, develop, 'feature/*', 'feat/*']
  pull_request:
    branches: [master, main]

env:
  REDIS_HOST: localhost
  REDIS_PORT: 6379

jobs:
  # ============================================================
  # Stage 1: Unit Tests (fastest feedback, ~10 seconds)
  # ============================================================
  # Dependencies: busted + mocks only
  # No external services needed
  # ============================================================
  unit-tests:
    name: Unit Tests (busted)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install dependencies
        run: |
          luarocks install busted
          luarocks install luafilesystem
          luarocks install lua-cjson

      - name: Run unit tests
        run: |
          cd tests
          busted unit/ --verbose --output=TAP

  # ============================================================
  # Stage 2: Integration Tests (~1 minute)
  # ============================================================
  # Dependencies: OpenResty environment (resty, ffi-zlib)
  # Uses APISIX container for OpenResty runtime
  # ============================================================
  integration-tests:
    name: Integration Tests (OpenResty)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests in APISIX container
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm \
            -v "${WORKSPACE}:/opt/unifra-apisix" \
            -w /opt/unifra-apisix \
            apache/apisix:3.14.0-debian \
            bash -c '
              export UNIFRA_PATH=/opt/unifra-apisix
              cd tests/integration
              failed=0
              for test_file in test_*.lua; do
                echo "=== Running $test_file ==="
                if resty "$test_file"; then
                  echo "[PASS] $test_file"
                else
                  echo "[FAIL] $test_file"
                  failed=1
                fi
                echo ""
              done
              exit $failed
            '

  # ============================================================
  # Stage 3: E2E Tests (~3 minutes)
  # ============================================================
  # Dependencies: Full stack (APISIX + etcd + Redis + Anvil)
  # Tests complete plugin chain with real requests
  # ============================================================
  e2e-tests:
    name: E2E Tests (Full Stack)
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Start test environment
        run: |
          cd test-env
          docker-compose up -d

      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start Anvil
        run: |
          anvil --host 0.0.0.0 --port 8545 &
          sleep 5

      - name: Wait for APISIX
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:9180/apisix/admin/plugins/list -H "X-API-KEY: unifra-test-admin-key" > /dev/null; do sleep 2; done'

      - name: Run E2E tests
        run: ./test-env/test-all.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          docker-compose -f test-env/docker-compose.yml logs > apisix-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apisix-logs
          path: apisix-logs.txt

      - name: Cleanup
        if: always()
        run: |
          cd test-env
          docker-compose down -v
