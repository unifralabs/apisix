#
# APISIX Dashboard Configuration
#
# Default credentials: admin / admin
# CHANGE THE PASSWORD IN PRODUCTION!
#

conf:
  listen:
    host: 0.0.0.0
    port: 9000
  etcd:
    endpoints:
      - etcd:2379
    prefix: "/apisix"
  log:
    error_log:
      level: warn
      file_path: /dev/stderr
    access_log:
      file_path: /dev/stdout

authentication:
  secret: unifra-dashboard-secret-change-me
  expire_time: 3600
  users:
    - username: admin
      password: admin  # CHANGE THIS IN PRODUCTION!

plugins:
  # List all available plugins (including Unifra plugins)
  - api-breaker
  - authz-keycloak
  - basic-auth
  - batch-requests
  - consumer-restriction
  - cors
  - echo
  - fault-injection
  - grpc-transcode
  - hmac-auth
  - http-logger
  - ip-restriction
  - jwt-auth
  - kafka-logger
  - key-auth
  - limit-conn
  - limit-count
  - limit-req
  - openid-connect
  - prometheus
  - proxy-cache
  - proxy-mirror
  - proxy-rewrite
  - redirect
  - referer-restriction
  - request-id
  - request-validation
  - response-rewrite
  - serverless-post-function
  - serverless-pre-function
  - sls-logger
  - syslog
  - tcp-logger
  - udp-logger
  - uri-blocker
  - wolf-rbac
  - zipkin
  # Unifra plugins
  - unifra-jsonrpc-var
  - unifra-ctx-var
  - unifra-whitelist
  - unifra-calculate-cu
  - unifra-limit-monthly-cu
  - unifra-limit-cu
  - unifra-ws-jsonrpc-proxy
