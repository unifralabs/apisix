#
# Unifra APISIX - Docker Compose Deployment
#
# Zero-intrusion deployment using official APISIX image + Unifra plugins
#
# Quick Start:
#   1. Download plugins: wget https://github.com/unifralabs/apisix/releases/latest/download/unifra-apisix-plugins-*.tar.gz
#   2. Extract: tar -xzf unifra-apisix-plugins-*.tar.gz
#   3. Update config.yaml with your settings
#   4. docker-compose up -d
#

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: unifra-etcd
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - unifra-net

  redis:
    image: redis:7-alpine
    container_name: unifra-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - unifra-net

  apisix:
    # Option 1: Use pre-built Unifra image (recommended)
    image: ghcr.io/unifralabs/apisix:latest

    # Option 2: Use official APISIX with volume mounts (most flexible)
    # image: apache/apisix:3.14.0-debian
    # volumes:
    #   - ./unifra-plugins/unifra:/opt/unifra-apisix/unifra:ro
    #   - ./unifra-plugins/apisix/plugins:/opt/unifra-apisix/apisix/plugins:ro
    #   - ./unifra-plugins/conf:/opt/unifra-apisix/conf:ro

    container_name: unifra-apisix
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9080:9080"   # HTTP proxy
      - "9443:9443"   # HTTPS proxy
      - "9180:9180"   # Admin API (restrict in production!)
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9080/apisix/status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - unifra-net

volumes:
  etcd-data:
  redis-data:

networks:
  unifra-net:
    driver: bridge
