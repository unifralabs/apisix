# etcd configuration
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30
  admin:
    admin_key:
      - name: admin
        key: unifra-test-admin-key
        role: admin
    allow_admin:
      - 0.0.0.0/0  # Allow all IPs (for testing only!)
    enable_admin_ui: true

# Logging
nginx_config:
  error_log_level: info
