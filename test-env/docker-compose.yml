services:
  # etcd for APISIX configuration storage
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    ports:
      - "2379:2379"
    volumes:
      - ./etcd_data:/etcd-data
    networks:
      - apisix-net

  # Redis for rate limiting
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      apisix-net:
        aliases:
          - apisix-redis

  # APISIX Gateway (Anvil runs on host)
  apisix:
    image: apache/apisix:3.14.0-debian
    depends_on:
      - etcd
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount Unifra plugins (repo root is the plugin directory)
      - ..:/opt/unifra-apisix:ro
      # Mount custom config
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080"   # HTTP proxy
      - "9180:9180"   # Admin API
      - "9443:9443"   # HTTPS proxy
    networks:
      - apisix-net

  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apisix-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - apisix-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - apisix-net

  clickhouse:
    image: clickhouse/clickhouse-server:23.3-alpine
    restart: always
    environment:
      CLICKHOUSE_DB: metrics_staging
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    depends_on:
      - kafka
    networks:
      - apisix-net

networks:
  apisix-net:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
