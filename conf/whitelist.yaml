# Unifra JSON-RPC Method Whitelist Configuration
#
# This file defines which JSON-RPC methods are available for each network.
# - free: Methods available to all users
# - paid: Methods only available to paid tier users
#
# Every effective permission resolves to an exact JSON-RPC method name.

schema_version: 1
revision: "2026-09-16.1"

# Reusable authoring profiles. They are expanded to exact method names when the
# gateway loads this file; wildcard permission matching is intentionally not
# supported. Network-level free/paid entries may add explicit exceptions.
